<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Studio</title>

  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Load Fonts (Bricolage Grotesque, Instrument Serif, Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Load React and ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Load Babel to translate JSX into browser-readable JavaScript -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg: #EDE9DD;
      --bg-2: #E5E0D2;
      --bg-3: #DAD3C1;
      --paper: #F5F1E5;
      --line: #CFC8B5;
      --ink: #14110B;
      --ink-2: #2C261A;
      --ink-mute: #6B6354;
      --ink-faint: #9A927F;
      --display: "Bricolage Grotesque", "Inter", -apple-system, sans-serif;
      --display-italic: "Instrument Serif", "Times New Roman", serif;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Brutalist Custom Slider Styling */
    .brutalist-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      background: var(--line);
      outline: none;
      border: 1px solid var(--ink);
    }

    .brutalist-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      background: var(--paper);
      border: 1.5px solid var(--ink);
      cursor: pointer;
      border-radius: 0;
      box-shadow: 2px 2px 0 var(--ink);
      transition: transform 0.1s;
    }

    .brutalist-slider::-webkit-slider-thumb:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0 var(--ink);
    }

    .brutalist-slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: var(--paper);
      border: 1.5px solid var(--ink);
      cursor: pointer;
      border-radius: 0;
      box-shadow: 2px 2px 0 var(--ink);
      transition: transform 0.1s;
    }
    
    .brutalist-slider::-moz-range-thumb:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0 var(--ink);
    }

    .brutalist-slider:focus {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    /* Custom Scrollbar for thumbnail view */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--ink-faint);
      border-radius: 0;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Inline Icons (Replacing lucide-react) ---
    const UploadIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></svg>
    );
    const RefreshCwIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 2v6h-6" /><path d="M3 12a9 9 0 0 1 15-6.7L21 8" /><path d="M3 22v-6h6" /><path d="M21 12a9 9 0 0 1-15 6.7L3 16" /></svg>
    );
    const ChevronRightIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6" /></svg>
    );
    const ShuffleIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 3 21 3 21 8" /><line x1="4" y1="20" x2="21" y2="3" /><polyline points="21 16 21 21 16 21" /><line x1="15" y1="15" x2="21" y2="21" /><line x1="4" y1="4" x2="9" y2="9" /></svg>
    );
    const TrashIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg>
    );
    const ArrowLeftIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></svg>
    );
    const ArrowRightIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></svg>
    );

    /**
     * Helper to load external scripts dynamically for Masonry and html2canvas
     */
    const loadScript = (src) => {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    };

    // --- Brutalist Design System UI Components ---
    const Label = ({ children, className = "" }) => (
      <label className={`block text-[11px] font-bold uppercase tracking-[0.08em] mb-1.5 ${className}`} style={{ fontFamily: 'var(--display)', color: 'var(--ink)' }}>
        {children}
      </label>
    );

    const Hint = ({ children }) => (
      <span className="block text-[13px] mb-2" style={{ color: 'var(--ink-mute)' }}>
        {children}
      </span>
    );

    const Input = ({ ...props }) => (
      <input
        {...props}
        className="h-10 w-full px-3 text-[13px] font-medium outline-none transition-colors"
        style={{ 
          background: 'var(--paper)', 
          border: '1.5px solid var(--ink)', 
          color: 'var(--ink)' 
        }}
        onFocus={(e) => { e.target.style.background = 'var(--bg)'; e.target.style.outline = '2px solid var(--ink)'; e.target.style.outlineOffset = '2px'; }}
        onBlur={(e) => { e.target.style.background = 'var(--paper)'; e.target.style.outline = 'none'; }}
      />
    );

    const Select = ({ children, ...props }) => (
      <select
        {...props}
        className="h-10 w-full px-3 text-[13px] font-medium outline-none transition-colors appearance-none"
        style={{ 
          background: 'var(--paper)', 
          border: '1.5px solid var(--ink)', 
          color: 'var(--ink)',
          backgroundImage: `url('data:image/svg+xml;utf8,<svg fill="black" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>')`,
          backgroundRepeat: 'no-repeat',
          backgroundPositionX: 'calc(100% - 8px)',
          backgroundPositionY: 'center'
        }}
        onFocus={(e) => { e.target.style.background = 'var(--bg)'; e.target.style.outline = '2px solid var(--ink)'; e.target.style.outlineOffset = '2px'; }}
        onBlur={(e) => { e.target.style.background = 'var(--paper)'; e.target.style.outline = 'none'; }}
      >
        {children}
      </select>
    );

    const Btn = ({ children, variant = "primary", className = "", ...props }) => {
      const isPrimary = variant === "primary";
      const bg = isPrimary ? 'var(--ink)' : 'transparent';
      const color = isPrimary ? 'var(--paper)' : 'var(--ink)';
      
      return (
        <button
          {...props}
          className={`group px-[22px] py-[10px] inline-flex items-center justify-center gap-[10px] text-[13px] font-bold uppercase tracking-wider transition-all disabled:opacity-50 disabled:cursor-not-allowed ${className}`}
          style={{ 
            background: bg, 
            color: color, 
            border: '1.5px solid var(--ink)',
            fontFamily: 'var(--display)'
          }}
          onMouseEnter={(e) => {
            if (props.disabled) return;
            e.currentTarget.style.background = isPrimary ? 'var(--paper)' : 'var(--ink)';
            e.currentTarget.style.color = isPrimary ? 'var(--ink)' : 'var(--paper)';
          }}
          onMouseLeave={(e) => {
            if (props.disabled) return;
            e.currentTarget.style.background = bg;
            e.currentTarget.style.color = color;
          }}
          onMouseDown={(e) => {
            if (props.disabled) return;
            e.currentTarget.style.transform = 'translate(2px, 2px)';
          }}
          onMouseUp={(e) => {
            if (props.disabled) return;
            e.currentTarget.style.transform = 'translate(0, 0)';
          }}
        >
          {children}
          {isPrimary && <span className="transition-transform group-hover:translate-x-[3px]"><ChevronRightIcon size={18} /></span>}
        </button>
      );
    };

    const Slider = ({ label, value, min, max, onChange, className = "" }) => (
      <div className={`mb-5 ${className} flex items-center gap-3`}>
        <Label className="!mb-0 w-24 shrink-0">{label}</Label>
        <input
          type="range"
          min={min}
          max={max}
          value={value}
          onChange={(e) => onChange(parseInt(e.target.value) || 0)}
          className="brutalist-slider flex-grow"
        />
        <span className="font-bold text-[13px] w-10 text-right shrink-0 font-mono" style={{ color: 'var(--ink)' }}>{value}</span>
      </div>
    );

    const Section = ({ title, children, hasDivider = true, className = "" }) => (
      <div className={`mb-6 pb-4 ${className}`} style={{ borderBottom: hasDivider ? '1px solid var(--line)' : 'none' }}>
        <h2 className="text-[20px] font-extrabold mb-5 uppercase tracking-tight" style={{ fontFamily: 'var(--display)', color: 'var(--ink)' }}>{title}</h2>
        {children}
      </div>
    );

    // --- Main App Component ---
    function App() {
      const [libsLoaded, setLibsLoaded] = useState(false);

      // State
      const [photos, setPhotos] = useState([]);
      const [draggedIndex, setDraggedIndex] = useState(null);
      const [cols, setCols] = useState(4);
      const [gap, setGap] = useState(12);
      const [radius, setRadius] = useState(6);
      const [borderWeight, setBorderWeight] = useState(1);
      const [zoom, setZoom] = useState(130);
      const [rotation, setRotation] = useState(20);
      const [aspectRatio, setAspectRatio] = useState('16:9');
      const [borderColor, setBorderColor] = useState('#4442e3');
      const [bgColor, setBgColor] = useState('#ededed');
      const [isExporting, setIsExporting] = useState(false);

      // Pan state
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const dragStart = useRef({ x: 0, y: 0 });

      // Refs
      const gridRef = useRef(null);
      const masonryInstance = useRef(null);
      const captureAreaRef = useRef(null);
      const workspaceRef = useRef(null);

      const [previewScale, setPreviewScale] = useState(0.55);

      const BASE_WIDTH = 1000;
      const canvasWidth = aspectRatio === '16:9' ? 1280 : 720;
      const canvasHeight = aspectRatio === '16:9' ? 720 : 1280;

      // Load external scripts
      useEffect(() => {
        const initLibs = async () => {
          try {
            await Promise.all([
              loadScript('https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js'),
              loadScript('https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js'),
              loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')
            ]);
            setLibsLoaded(true);
          } catch (err) {
            console.error("Failed to load libraries", err);
          }
        };
        initLibs();
      }, []);

      // Initialize and Update Masonry
      useEffect(() => {
        if (libsLoaded && gridRef.current) {
          window.imagesLoaded(gridRef.current, () => {
            if (!masonryInstance.current) {
              masonryInstance.current = new window.Masonry(gridRef.current, {
                itemSelector: '.grid-item',
                columnWidth: '.grid-item',
                percentPosition: false,
                transitionDuration: '0.4s',
                gutter: gap
              });
            } else {
              masonryInstance.current.options.gutter = gap;
              masonryInstance.current.reloadItems();
              masonryInstance.current.layout();
            }
          });
        }
      }, [libsLoaded, photos, gap, cols]);

      // Handle Dragging
      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!isDragging) return;
          setPan({ x: e.clientX - dragStart.current.x, y: e.clientY - dragStart.current.y });
        };
        const handleMouseUp = () => setIsDragging(false);

        if (isDragging) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isDragging]);

      // Responsive preview scaling
      useEffect(() => {
        const updateScale = () => {
          if (workspaceRef.current) {
            const { clientWidth, clientHeight } = workspaceRef.current;
            const padding = 160;

            const scaleX = (clientWidth - padding) / canvasWidth;
            const scaleY = (clientHeight - padding) / canvasHeight;
            const newScale = Math.min(scaleX, scaleY);

            setPreviewScale(Math.min(newScale, 1.2));
          }
        };

        if (libsLoaded) {
          setTimeout(updateScale, 50);
        }

        window.addEventListener('resize', updateScale);
        return () => window.removeEventListener('resize', updateScale);
      }, [libsLoaded, canvasWidth, canvasHeight]);

      const handleUpload = (e) => {
        const files = Array.from(e.target.files);
        const newPhotos = files.map(file => ({
          id: Math.random().toString(36).substring(2, 9) + '-' + Date.now(),
          src: URL.createObjectURL(file)
        }));
        setPhotos(prev => [...prev, ...newPhotos]);
        e.target.value = null;
      };

      const handleShuffle = () => {
        setPhotos(prev => {
          const shuffled = [...prev];
          for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }
          return shuffled;
        });
      };

      const handleDelete = (index) => {
        setPhotos(prev => prev.filter((_, i) => i !== index));
      };

      const handleMove = (index, direction) => {
        setPhotos(prev => {
          const nextPhotos = [...prev];
          const targetIndex = index + direction;
          if (targetIndex >= 0 && targetIndex < nextPhotos.length) {
            [nextPhotos[index], nextPhotos[targetIndex]] = [nextPhotos[targetIndex], nextPhotos[index]];
          }
          return nextPhotos;
        });
      };

      const handleDragStart = (e, index) => {
        setDraggedIndex(index);
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', index);
      };

      const handleDragOver = (e, index) => {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === index) return;

        setPhotos(prev => {
          const updated = [...prev];
          const draggedItem = updated[draggedIndex];
          updated.splice(draggedIndex, 1);
          updated.splice(index, 0, draggedItem);
          return updated;
        });

        setDraggedIndex(index);
      };

      const handleDragEnd = () => {
        setDraggedIndex(null);
      };

      const handleExport = async () => {
        if (!captureAreaRef.current || !window.html2canvas) return;
        setIsExporting(true);

        const parentElement = captureAreaRef.current.parentElement;
        const originalTransform = parentElement.style.transform;
        parentElement.style.transform = 'scale(1)';

        await new Promise(resolve => setTimeout(resolve, 50));

        try {
          const canvas = await window.html2canvas(captureAreaRef.current, {
            useCORS: true,
            scale: 3,
            backgroundColor: bgColor,
            width: canvasWidth,
            height: canvasHeight,
            onclone: (doc) => {
              const mask = doc.getElementById('bleed-mask-node');
              if (mask) mask.style.display = 'none';
            }
          });

          const link = document.createElement('a');
          link.download = `slide-studio-export.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        } catch (err) {
          console.error("Export Error:", err);
        } finally {
          parentElement.style.transform = originalTransform;
          setIsExporting(false);
        }
      };

      const itemWidth = (BASE_WIDTH - (gap * (cols - 1))) / cols;

      if (!libsLoaded) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-[var(--bg)] text-[var(--ink)]">
            <p className="text-lg font-bold" style={{ fontFamily: 'var(--display)' }}>Loading components...</p>
          </div>
        );
      }

      return (
        <div className="h-screen flex overflow-hidden font-sans" style={{ background: 'var(--bg)', color: 'var(--ink)' }}>

          {/* Workspace Area */}
          <main
            ref={workspaceRef}
            className="flex-grow flex items-center justify-center relative overflow-hidden"
            style={{ background: 'var(--bg-2)', borderRight: '1px solid var(--line)' }}
          >
            <div style={{ transform: `scale(${previewScale})`, transformOrigin: 'center' }}>
              <div
                id="capture-area-node"
                ref={captureAreaRef}
                onMouseDown={(e) => {
                  if (e.button !== 0) return;
                  setIsDragging(true);
                  dragStart.current = { x: e.clientX - pan.x, y: e.clientY - pan.y };
                }}
                style={{
                  backgroundColor: bgColor,
                  width: `${canvasWidth}px`,
                  height: `${canvasHeight}px`,
                  position: 'relative',
                  overflow: 'visible',
                  cursor: isDragging ? 'grabbing' : 'grab',
                  boxShadow: '0 10px 40px rgba(0,0,0,0.1)'
                }}
              >
                <div style={{
                  transform: `translate(${pan.x}px, ${pan.y}px) rotate(${rotation}deg)`,
                  display: 'inline-block'
                }}>
                  <div style={{ transform: `scale(${zoom / 100})`, transformOrigin: 'center center' }}>
                    <div ref={gridRef} className="grid" style={{ width: `${BASE_WIDTH}px` }}>
                      {photos.map((photo) => (
                        <div key={photo.id} className="grid-item" style={{ width: `${itemWidth}px`, marginBottom: `${gap}px` }}>
                          <div className="bg-[var(--paper)]" style={{ borderRadius: `${radius}px`, border: `${borderWeight}px solid ${borderColor}`, overflow: 'hidden' }}>
                            <img src={photo.src} alt="" className="w-full block pointer-events-none" />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Viewport Guide */}
                <div id="bleed-mask-node" className="absolute inset-0 pointer-events-none" style={{ boxShadow: '0 0 0 10000px rgba(229, 224, 210, 0.85)', border: '2px solid var(--ink)', zIndex: 50 }}>
                </div>
              </div>
            </div>
          </main>

          {/* Sidebar */}
          <aside className="w-[380px] overflow-y-auto p-7 flex flex-col shrink-0 z-20" style={{ background: 'var(--paper)', borderLeft: '1.5px solid var(--ink)' }}>
            <h1 className="text-[32px] font-extrabold mb-2 uppercase tracking-tight" style={{ fontFamily: 'var(--display)', color: 'var(--ink)' }}>Slide Studio</h1>
            <p className="text-[14px] mb-6 leading-relaxed" style={{ color: 'var(--ink-2)' }}>Upload images to create custom masonry grids for your presentation.</p>

            <Section title="1. Add files">
              <Hint>JPG or PNG images.</Hint>
              <div className="flex gap-2 mb-4">
                <Btn variant="secondary" onClick={() => document.getElementById('up').click()} className="flex-grow">
                  <UploadIcon size={16} /> Choose files
                </Btn>
                {photos.length > 1 && (
                  <Btn
                    variant="secondary"
                    onClick={handleShuffle}
                    className="w-[44px] !px-0 shrink-0"
                    title="Shuffle images"
                  >
                    <ShuffleIcon size={16} />
                  </Btn>
                )}
              </div>

              {/* Thumbnail manager */}
              {photos.length > 0 && (
                <div className="p-3 mb-4" style={{ background: 'var(--bg)', border: '1.5px solid var(--ink)' }}>
                  <div className="flex justify-between items-center mb-3">
                    <span className="text-[10px] font-bold uppercase tracking-[0.1em]" style={{ fontFamily: 'var(--display)', color: 'var(--ink)' }}>
                      Manage Images ({photos.length})
                    </span>
                  </div>
                  <div className="grid grid-cols-4 gap-2 max-h-[140px] overflow-y-auto p-1 pr-2">
                    {photos.map((photo, index) => (
                      <div
                        key={photo.id}
                        draggable="true"
                        onDragStart={(e) => handleDragStart(e, index)}
                        onDragOver={(e) => handleDragOver(e, index)}
                        onDragEnd={handleDragEnd}
                        className={`group relative aspect-square transition-all cursor-grab active:cursor-grabbing ${
                          draggedIndex === index ? 'opacity-40 border-dashed border-[1.5px]' : 'border-[1.5px]'
                        }`}
                        style={{ 
                          background: 'var(--paper)', 
                          borderColor: draggedIndex === index ? 'var(--ink)' : 'var(--line)' 
                        }}
                        onMouseEnter={(e) => {
                          if (draggedIndex !== index) e.currentTarget.style.borderColor = 'var(--ink)';
                        }}
                        onMouseLeave={(e) => {
                          if (draggedIndex !== index) e.currentTarget.style.borderColor = 'var(--line)';
                        }}
                      >
                        <img
                          src={photo.src}
                          alt=""
                          className="w-full h-full object-cover pointer-events-none"
                        />
                        {/* Overlay Controls */}
                        <div className="absolute inset-0 bg-[#14110bd0] opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-between p-1">
                          {/* Delete Button at top-right */}
                          <div className="flex justify-end">
                            <button
                              onClick={() => handleDelete(index)}
                              className="text-[var(--paper)] hover:text-[#e8a52b] p-0.5 transition-colors"
                              title="Delete image"
                            >
                              <TrashIcon size={12} />
                            </button>
                          </div>

                          {/* Reorder Buttons at bottom */}
                          <div className="flex justify-between w-full">
                            <button
                              onClick={() => handleMove(index, -1)}
                              disabled={index === 0}
                              className="text-[var(--paper)] hover:text-[#e8a52b] disabled:opacity-30 p-0.5 transition-colors"
                              title="Move left"
                            >
                              <ArrowLeftIcon size={12} />
                            </button>
                            <button
                              onClick={() => handleMove(index, 1)}
                              disabled={index === photos.length - 1}
                              className="text-[var(--paper)] hover:text-[#e8a52b] disabled:opacity-30 p-0.5 transition-colors"
                              title="Move right"
                            >
                              <ArrowRightIcon size={12} />
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              <input type="file" id="up" multiple accept=".png, .jpg, .jpeg" onChange={handleUpload} className="hidden" />
            </Section>

            <Section title="2. Grid layout">
              <div className="grid grid-cols-2 gap-4 mb-3">
                <div><Label>Columns</Label><Input type="number" value={cols} onChange={(e) => setCols(parseInt(e.target.value) || 1)} /></div>
                <div><Label>Gap (px)</Label><Input type="number" value={gap} onChange={(e) => setGap(parseInt(e.target.value) || 0)} /></div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><Label>Border radius</Label><Input type="number" value={radius} onChange={(e) => setRadius(parseInt(e.target.value) || 0)} /></div>
                <div><Label>Border weight</Label><Input type="number" value={borderWeight} onChange={(e) => setBorderWeight(parseInt(e.target.value) || 0)} /></div>
              </div>
            </Section>

            <Section title="3. Adjust viewport">
              <div className="mb-7">
                <Label>Format</Label>
                <Select value={aspectRatio} onChange={(e) => setAspectRatio(e.target.value)}>
                  <option value="16:9">Landscape (16:9)</option>
                  <option value="9:16">Portrait (9:16)</option>
                </Select>
              </div>

              <Slider
                label="Zoom %"
                value={zoom}
                min={10}
                max={400}
                onChange={setZoom}
              />

              <Slider
                label="Rotation °"
                value={rotation}
                min={-180}
                max={180}
                onChange={setRotation}
              />
            </Section>

            {/* Appearance Section */}
            <Section title="4. Appearance" hasDivider={false} className="mb-6">
              <div className="space-y-3">
                <div className="flex justify-between items-center py-2 px-3" style={{ background: 'var(--bg)', border: '1.5px solid var(--ink)' }}>
                  <Label className="!mb-0">Border color</Label>
                  <input type="color" value={borderColor} onChange={(e) => setBorderColor(e.target.value)} className="w-8 h-8 cursor-pointer border-none p-0 outline-none" style={{ background: 'transparent' }} />
                </div>
                <div className="flex justify-between items-center py-2 px-3" style={{ background: 'var(--bg)', border: '1.5px solid var(--ink)' }}>
                  <Label className="!mb-0">Canvas background</Label>
                  <input type="color" value={bgColor} onChange={(e) => setBgColor(e.target.value)} className="w-8 h-8 cursor-pointer border-none p-0 outline-none" style={{ background: 'transparent' }} />
                </div>
              </div>
            </Section>

            {/* Action Area */}
            <div className="mt-auto pt-6" style={{ borderTop: '1px solid var(--line)' }}>
              <Btn
                variant="primary"
                onClick={handleExport}
                disabled={isExporting || photos.length === 0}
                className="w-full mb-4 h-[46px]"
              >
                {isExporting ? 'Exporting...' : 'Export Image'}
              </Btn>

              <button
                onClick={() => window.location.reload()}
                className="text-[12px] font-bold uppercase tracking-[0.05em] flex items-center gap-2 transition-colors mx-auto"
                style={{ fontFamily: 'var(--display)', color: 'var(--ink-mute)' }}
                onMouseEnter={(e) => e.currentTarget.style.color = 'var(--ink)'}
                onMouseLeave={(e) => e.currentTarget.style.color = 'var(--ink-mute)'}
              >
                <RefreshCwIcon size={14} /> Clear settings
              </button>
            </div>
          </aside>
        </div>
      );
    }

    // --- Render the App ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
