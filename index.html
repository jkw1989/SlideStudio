<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Studio</title>

  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Load React and ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Load Babel to translate JSX into browser-readable JavaScript -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Slider Styling to match GDS screenshot */
    .gds-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      background: #b1b4b6;
      outline: none;
    }

    /* Chrome, Safari, Edge, Opera */
    .gds-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      background: #0b0c0c;
      cursor: pointer;
      border: none;
      border-radius: 0;
    }

    /* Firefox */
    .gds-slider::-moz-range-thumb {
      width: 24px;
      height: 24px;
      background: #0b0c0c;
      cursor: pointer;
      border: none;
      border-radius: 0;
    }

    .gds-slider:focus {
      box-shadow: 0 0 0 4px #ffdd00;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Inline Icons (Replacing lucide-react) ---
    const UploadIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></svg>
    );
    const RefreshCwIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 2v6h-6" /><path d="M3 12a9 9 0 0 1 15-6.7L21 8" /><path d="M3 22v-6h6" /><path d="M21 12a9 9 0 0 1-15 6.7L3 16" /></svg>
    );
    const ChevronRightIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6" /></svg>
    );
    const ShuffleIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 3 21 3 21 8" /><line x1="4" y1="20" x2="21" y2="3" /><polyline points="21 16 21 21 16 21" /><line x1="15" y1="15" x2="21" y2="21" /><line x1="4" y1="4" x2="9" y2="9" /></svg>
    );
    const TrashIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg>
    );
    const ArrowLeftIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></svg>
    );
    const ArrowRightIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></svg>
    );

    /**
     * Helper to load external scripts dynamically for Masonry and html2canvas
     */
    const loadScript = (src) => {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    };

    // --- GOV.UK Design System Style Tokens ---
    const GDS_COLORS = {
      blue: "#4442e3",
      black: "#0b0c0c",
      grey1: "#b1b4b6",
      grey3: "#f3f2f1",
      white: "#ffffff",
      primary: "#4442e3",
      yellow: "#ffdd00",
      text: "#0b0c0c",
      workspace: "#e6e6e6",
      darkGrey: "#505a5f"
    };

    // --- GDS UI Components ---
    const GdsLabel = ({ children, className = "" }) => (
      <label className={`block text-sm font-bold mb-0.5 ${className}`} style={{ color: GDS_COLORS.black }}>
        {children}
      </label>
    );

    const GdsHint = ({ children }) => (
      <span className="block text-xs mb-1" style={{ color: "#505a5f" }}>
        {children}
      </span>
    );

    const GdsInput = ({ ...props }) => (
      <input
        {...props}
        className="h-9 w-full border-2 border-black px-2 text-base focus:outline-none focus:ring-4 focus:ring-[#ffb60c]"
        style={{ borderColor: GDS_COLORS.black }}
      />
    );

    const GdsSelect = ({ children, ...props }) => (
      <select
        {...props}
        className="h-9 w-full border-2 border-black px-2 text-base focus:outline-none focus:ring-4 focus:ring-[#ffb60c] bg-white"
        style={{ borderColor: GDS_COLORS.black }}
      >
        {children}
      </select>
    );

    const GdsButton = ({ children, variant = "primary", className = "", ...props }) => {
      const styles = {
        primary: {
          backgroundColor: GDS_COLORS.primary,
          color: 'white',
          boxShadow: '0 2px 0 #1a1a5e',
        },
        secondary: {
          backgroundColor: '#f3f2f1',
          color: '#0b0c0c',
          boxShadow: '0 2px 0 #b1b4b6',
        }
      };

      return (
        <button
          {...props}
          className={`px-4 py-2 font-bold text-base inline-flex items-center justify-center gap-2 active:top-[2px] active:shadow-none relative transition-all ${className}`}
          style={styles[variant]}
        >
          {children}
          {variant === "primary" && <ChevronRightIcon size={18} />}
        </button>
      );
    };

    const GdsSlider = ({ label, value, min, max, onChange, className = "" }) => (
      <div className={`mb-4 ${className} flex items-center gap-3`}>
        <GdsLabel className="!mb-0 w-24 shrink-0">{label}</GdsLabel>
        <input
          type="range"
          min={min}
          max={max}
          value={value}
          onChange={(e) => onChange(parseInt(e.target.value) || 0)}
          className="gds-slider flex-grow"
        />
        <span className="font-bold text-base w-10 text-right shrink-0">{value}</span>
      </div>
    );

    const GdsSection = ({ title, children, hasDivider = true, className = "" }) => (
      <div className={`mb-4 pb-3 ${hasDivider ? 'border-b border-gray-200' : ''} ${className}`}>
        <h2 className="text-base font-bold mb-4 uppercase tracking-wide" style={{ color: GDS_COLORS.black }}>{title}</h2>
        {children}
      </div>
    );

    // --- Main App Component ---
    function App() {
      const [libsLoaded, setLibsLoaded] = useState(false);

      // State
      const [photos, setPhotos] = useState([]);
      const [draggedIndex, setDraggedIndex] = useState(null);
      const [cols, setCols] = useState(4);
      const [gap, setGap] = useState(12);
      const [radius, setRadius] = useState(6);
      const [borderWeight, setBorderWeight] = useState(1);
      const [zoom, setZoom] = useState(130);
      const [rotation, setRotation] = useState(20);
      const [aspectRatio, setAspectRatio] = useState('16:9');
      const [borderColor, setBorderColor] = useState('#4442e3');
      const [bgColor, setBgColor] = useState('#ededed');
      const [isExporting, setIsExporting] = useState(false);

      // Pan state
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const dragStart = useRef({ x: 0, y: 0 });

      // Refs
      const gridRef = useRef(null);
      const masonryInstance = useRef(null);
      const captureAreaRef = useRef(null);
      const workspaceRef = useRef(null);

      const [previewScale, setPreviewScale] = useState(0.55);

      const BASE_WIDTH = 1000;
      const canvasWidth = aspectRatio === '16:9' ? 1280 : 720;
      const canvasHeight = aspectRatio === '16:9' ? 720 : 1280;

      // Load external scripts
      useEffect(() => {
        const initLibs = async () => {
          try {
            await Promise.all([
              loadScript('https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js'),
              loadScript('https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js'),
              loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')
            ]);
            setLibsLoaded(true);
          } catch (err) {
            console.error("Failed to load libraries", err);
          }
        };
        initLibs();
      }, []);

      // Initialize and Update Masonry
      useEffect(() => {
        if (libsLoaded && gridRef.current) {
          window.imagesLoaded(gridRef.current, () => {
            if (!masonryInstance.current) {
              masonryInstance.current = new window.Masonry(gridRef.current, {
                itemSelector: '.grid-item',
                columnWidth: '.grid-item',
                percentPosition: false,
                transitionDuration: '0.4s',
                gutter: gap
              });
            } else {
              masonryInstance.current.options.gutter = gap;
              masonryInstance.current.reloadItems();
              masonryInstance.current.layout();
            }
          });
        }
      }, [libsLoaded, photos, gap, cols]);

      // Handle Dragging
      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!isDragging) return;
          setPan({ x: e.clientX - dragStart.current.x, y: e.clientY - dragStart.current.y });
        };
        const handleMouseUp = () => setIsDragging(false);

        if (isDragging) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isDragging]);

      // Responsive preview scaling
      useEffect(() => {
        const updateScale = () => {
          if (workspaceRef.current) {
            const { clientWidth, clientHeight } = workspaceRef.current;
            const padding = 160;

            const scaleX = (clientWidth - padding) / canvasWidth;
            const scaleY = (clientHeight - padding) / canvasHeight;
            const newScale = Math.min(scaleX, scaleY);

            setPreviewScale(Math.min(newScale, 1.2));
          }
        };

        if (libsLoaded) {
          setTimeout(updateScale, 50);
        }

        window.addEventListener('resize', updateScale);
        return () => window.removeEventListener('resize', updateScale);
      }, [libsLoaded, canvasWidth, canvasHeight]);

      const handleUpload = (e) => {
        const files = Array.from(e.target.files);
        const newPhotos = files.map(file => ({
          id: Math.random().toString(36).substring(2, 9) + '-' + Date.now(),
          src: URL.createObjectURL(file)
        }));
        setPhotos(prev => [...prev, ...newPhotos]);
        e.target.value = null;
      };

      const handleShuffle = () => {
        setPhotos(prev => {
          const shuffled = [...prev];
          for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }
          return shuffled;
        });
      };

      const handleDelete = (index) => {
        setPhotos(prev => prev.filter((_, i) => i !== index));
      };

      const handleMove = (index, direction) => {
        setPhotos(prev => {
          const nextPhotos = [...prev];
          const targetIndex = index + direction;
          if (targetIndex >= 0 && targetIndex < nextPhotos.length) {
            [nextPhotos[index], nextPhotos[targetIndex]] = [nextPhotos[targetIndex], nextPhotos[index]];
          }
          return nextPhotos;
        });
      };

      const handleDragStart = (e, index) => {
        setDraggedIndex(index);
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', index);
      };

      const handleDragOver = (e, index) => {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === index) return;

        setPhotos(prev => {
          const updated = [...prev];
          const draggedItem = updated[draggedIndex];
          updated.splice(draggedIndex, 1);
          updated.splice(index, 0, draggedItem);
          return updated;
        });

        setDraggedIndex(index);
      };

      const handleDragEnd = () => {
        setDraggedIndex(null);
      };

      const handleExport = async () => {
        if (!captureAreaRef.current || !window.html2canvas) return;
        setIsExporting(true);

        const parentElement = captureAreaRef.current.parentElement;
        const originalTransform = parentElement.style.transform;
        parentElement.style.transform = 'scale(1)';

        await new Promise(resolve => setTimeout(resolve, 50));

        try {
          const canvas = await window.html2canvas(captureAreaRef.current, {
            useCORS: true,
            scale: 3,
            backgroundColor: bgColor,
            width: canvasWidth,
            height: canvasHeight,
            onclone: (doc) => {
              const mask = doc.getElementById('bleed-mask-node');
              if (mask) mask.style.display = 'none';
            }
          });

          const link = document.createElement('a');
          link.download = `slide-studio-export.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        } catch (err) {
          console.error("Export Error:", err);
        } finally {
          parentElement.style.transform = originalTransform;
          setIsExporting(false);
        }
      };

      const itemWidth = (BASE_WIDTH - (gap * (cols - 1))) / cols;

      if (!libsLoaded) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-[#e6e6e6]">
            <p className="text-lg font-bold">Loading components...</p>
          </div>
        );
      }

      return (
        <div className="bg-[#f9f9fb] h-screen flex overflow-hidden text-[#0b0c0c] font-sans">

          {/* Workspace Area */}
          <main
            ref={workspaceRef}
            className="flex-grow bg-[#e6e6e6] flex items-center justify-center relative overflow-hidden border-r border-gray-300"
          >
            <div style={{ transform: `scale(${previewScale})`, transformOrigin: 'center' }}>
              <div
                id="capture-area-node"
                ref={captureAreaRef}
                onMouseDown={(e) => {
                  if (e.button !== 0) return;
                  setIsDragging(true);
                  dragStart.current = { x: e.clientX - pan.x, y: e.clientY - pan.y };
                }}
                style={{
                  backgroundColor: bgColor,
                  width: `${canvasWidth}px`,
                  height: `${canvasHeight}px`,
                  position: 'relative',
                  overflow: 'visible',
                  cursor: isDragging ? 'grabbing' : 'grab',
                  boxShadow: '0 10px 40px rgba(0,0,0,0.1)'
                }}
              >
                <div style={{
                  transform: `translate(${pan.x}px, ${pan.y}px) rotate(${rotation}deg)`,
                  display: 'inline-block'
                }}>
                  <div style={{ transform: `scale(${zoom / 100})`, transformOrigin: 'center center' }}>
                    <div ref={gridRef} className="grid" style={{ width: `${BASE_WIDTH}px` }}>
                      {photos.map((photo) => (
                        <div key={photo.id} className="grid-item" style={{ width: `${itemWidth}px`, marginBottom: `${gap}px` }}>
                          <div className="bg-white" style={{ borderRadius: `${radius}px`, border: `${borderWeight}px solid ${borderColor}`, overflow: 'hidden' }}>
                            <img src={photo.src} alt="" className="w-full block pointer-events-none" />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Viewport Guide */}
                <div id="bleed-mask-node" className="absolute inset-0 pointer-events-none" style={{ boxShadow: '0 0 0 10000px rgba(230, 230, 230, 0.85)', border: '2px solid #505a5f', zIndex: 50 }}>
                </div>
              </div>
            </div>
          </main>

          {/* Sidebar */}
          <aside className="w-[380px] bg-white overflow-y-auto p-6 flex flex-col shrink-0 border-l border-gray-200 shadow-2xl z-20">
            <h1 className="text-3xl font-bold mb-1 tracking-tight">Slide Studio</h1>
            <p className="text-xs text-gray-500 mb-3 leading-relaxed">Upload images to create custom masonry grids for your presentation</p>

            <GdsSection title="1. Add files">
              <GdsHint>JPG or PNG images.</GdsHint>
              <div className="flex gap-2 mb-3">
                <GdsButton variant="secondary" onClick={() => document.getElementById('up').click()} className="flex-grow">
                  <UploadIcon size={16} /> Choose files
                </GdsButton>
                {photos.length > 1 && (
                  <GdsButton
                    variant="secondary"
                    onClick={handleShuffle}
                    className="w-10 !px-0 shrink-0"
                    title="Shuffle images"
                  >
                    <ShuffleIcon size={16} />
                  </GdsButton>
                )}
              </div>

              {/* Thumbnail manager */}
              {photos.length > 0 && (
                <div className="border border-gray-200 rounded p-2 bg-gray-50 mb-3">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-xs font-bold text-gray-500 uppercase tracking-wide">
                      Manage Images ({photos.length})
                    </span>
                  </div>
                  <div className="grid grid-cols-4 gap-2 max-h-40 overflow-y-auto p-1">
                    {photos.map((photo, index) => (
                      <div
                        key={photo.id}
                        draggable="true"
                        onDragStart={(e) => handleDragStart(e, index)}
                        onDragOver={(e) => handleDragOver(e, index)}
                        onDragEnd={handleDragEnd}
                        className={`group relative aspect-square bg-white border border-gray-300 rounded overflow-hidden shadow-sm hover:border-black transition-colors cursor-grab active:cursor-grabbing ${
                          draggedIndex === index ? 'opacity-40 border-dashed border-2 border-[#4442e3]' : ''
                        }`}
                      >
                        <img
                          src={photo.src}
                          alt=""
                          className="w-full h-full object-cover pointer-events-none"
                        />
                        {/* Overlay Controls */}
                        <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-between p-1">
                          {/* Delete Button at top-right */}
                          <div className="flex justify-end">
                            <button
                              onClick={() => handleDelete(index)}
                              className="text-white hover:text-red-400 p-0.5 bg-black/40 rounded transition-colors"
                              title="Delete image"
                            >
                              <TrashIcon size={12} />
                            </button>
                          </div>

                          {/* Reorder Buttons at bottom */}
                          <div className="flex justify-between w-full">
                            <button
                              onClick={() => handleMove(index, -1)}
                              disabled={index === 0}
                              className="text-white hover:text-yellow-400 disabled:opacity-30 disabled:hover:text-white p-0.5 bg-black/40 rounded transition-colors"
                              title="Move left"
                            >
                              <ArrowLeftIcon size={12} />
                            </button>
                            <button
                              onClick={() => handleMove(index, 1)}
                              disabled={index === photos.length - 1}
                              className="text-white hover:text-yellow-400 disabled:opacity-30 disabled:hover:text-white p-0.5 bg-black/40 rounded transition-colors"
                              title="Move right"
                            >
                              <ArrowRightIcon size={12} />
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              <input type="file" id="up" multiple accept=".png, .jpg, .jpeg" onChange={handleUpload} className="hidden" />
            </GdsSection>

            <GdsSection title="2. Grid layout">
              <div className="grid grid-cols-2 gap-3 mb-2">
                <div><GdsLabel>Columns</GdsLabel><GdsInput type="number" value={cols} onChange={(e) => setCols(parseInt(e.target.value) || 1)} /></div>
                <div><GdsLabel>Gap (px)</GdsLabel><GdsInput type="number" value={gap} onChange={(e) => setGap(parseInt(e.target.value) || 0)} /></div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div><GdsLabel>Border radius</GdsLabel><GdsInput type="number" value={radius} onChange={(e) => setRadius(parseInt(e.target.value) || 0)} /></div>
                <div><GdsLabel>Border weight</GdsLabel><GdsInput type="number" value={borderWeight} onChange={(e) => setBorderWeight(parseInt(e.target.value) || 0)} /></div>
              </div>
            </GdsSection>

            <GdsSection title="3. Adjust viewport">
              <div className="mb-6">
                <GdsLabel>Format</GdsLabel>
                <GdsSelect value={aspectRatio} onChange={(e) => setAspectRatio(e.target.value)}>
                  <option value="16:9">Landscape (16:9)</option>
                  <option value="9:16">Portrait (9:16)</option>
                </GdsSelect>
              </div>

              <GdsSlider
                label="Zoom %"
                value={zoom}
                min={10}
                max={400}
                onChange={setZoom}
              />

              <GdsSlider
                label="Rotation °"
                value={rotation}
                min={-180}
                max={180}
                onChange={setRotation}
              />
            </GdsSection>

            {/* Appearance Section */}
            <GdsSection title="4. Appearance" hasDivider={false} className="mb-6">
              <div className="space-y-2">
                <div className="flex justify-between items-center py-1 px-3 border-l-4 border-black" style={{ backgroundColor: GDS_COLORS.grey3 }}>
                  <GdsLabel className="!mb-0">Border color</GdsLabel>
                  <input type="color" value={borderColor} onChange={(e) => setBorderColor(e.target.value)} className="w-8 h-8 cursor-pointer" />
                </div>
                <div className="flex justify-between items-center py-1 px-3 border-l-4 border-black" style={{ backgroundColor: GDS_COLORS.grey3 }}>
                  <GdsLabel className="!mb-0">Canvas background</GdsLabel>
                  <input type="color" value={bgColor} onChange={(e) => setBgColor(e.target.value)} className="w-8 h-8 cursor-pointer" />
                </div>
              </div>
            </GdsSection>

            {/* Action Area */}
            <div className="mt-auto pt-4 border-t border-gray-200">
              <GdsButton
                variant="primary"
                onClick={handleExport}
                disabled={isExporting || photos.length === 0}
                className="w-full mb-3 h-12"
              >
                {isExporting ? 'Exporting...' : 'Export Image'}
              </GdsButton>

              <button
                onClick={() => window.location.reload()}
                className="text-sm font-bold underline text-[#1d70b8] hover:text-[#003078] flex items-center gap-1"
              >
                <RefreshCwIcon size={14} /> Clear settings
              </button>
            </div>
          </aside>
        </div>
      );
    }

    // --- Render the App ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
